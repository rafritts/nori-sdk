services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nori
      POSTGRES_PASSWORD: nori
      POSTGRES_DB: nori_retail
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nori -d nori_retail"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
