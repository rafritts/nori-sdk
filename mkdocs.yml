site_name: Nori
site_description: A batteries-included agent framework for Python
site_url: https://nori-sdk.com
repo_url: https://github.com/rafritts/nori
repo_name: rafritts/nori

theme:
  name: material
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - admonition
  - pymdownx.details
  - attr_list

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - The Agent: agent.md
  - Tools: tools.md
  - MCP: mcp.md
  - Patterns: patterns.md
  - Permissions: permissions.md
  - Anti-Spin: anti-spin.md
  - Observability: observability.md
  - CLI: cli.md
  - Demos: demos.md
