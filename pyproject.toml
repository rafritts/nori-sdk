[project]
name = "nori-sdk"
version = "0.1.0"
description = "A framework for building agentic AI applications"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Ryan Fritts", email = "ryan.fritts@live.com" }]
dependencies = [
    "openai>=2.36.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
]

[project.urls]
Homepage = "https://nori-sdk.com"
Repository = "https://github.com/restlessapi/nori"

[project.scripts]
nori = "nori.cli:main"

[project.optional-dependencies]
browser = [
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "lxml>=6.1.0",
    "pillow>=12.2.0",
    "playwright>=1.59.0",
]
data = ["jsonpath-ng>=1.8.0"]
postgres = ["asyncpg>=0.29"]
redis = ["redis>=5.0"]
mongo = ["motor>=3.3"]
bedrock = ["boto3"]
server = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
]
all = [
    "nori-sdk[browser]",
    "nori-sdk[data]",
    "nori-sdk[postgres]",
    "nori-sdk[redis]",
    "nori-sdk[mongo]",
    "nori-sdk[bedrock]",
    "nori-sdk[server]",
]

[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.15.12",
]

[tool.setuptools.packages.find]
include = ["nori*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nori --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["nori"]
omit = ["nori/tools/self_modify/*"]

[tool.coverage.report]
show_missing = true
