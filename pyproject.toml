[project]
name = "nori"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "asyncpg>=0.31.0",
    "beautifulsoup4>=4.14.3",
    "httpx>=0.28.1",
    "lxml>=6.1.0",
    "openai>=2.36.0",
    "pillow>=12.2.0",
    "playwright>=1.59.0",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.2",
    "redis>=7.4.0",
]

[project.optional-dependencies]
bedrock = ["boto3"]
server = [
    "fastapi>=0.136.1",
    "uvicorn>=0.46.0",
]

[dependency-groups]
dev = [
    "mypy>=2.0.0",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
    "pytest-cov>=7.1.0",
    "radon>=6.0.1",
    "ruff>=0.15.12",
]

[tool.setuptools.packages.find]
include = ["nori*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=nori --cov-report=term-missing"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["nori"]
omit = ["nori/tools/self_modify/*"]

[tool.coverage.report]
show_missing = true
